services:
  - type: web
    name: stroke-insight-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/ml/prepare_data.py && python backend/ml/split_data.py
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: FRONTEND_ORIGINS
        fromService:
          type: static
          name: stroke-insight-web
          property: host

  - type: static
    name: stroke-insight-web
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: stroke-insight-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
